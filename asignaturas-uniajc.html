<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra de búsqueda fija arriba; filtros en chips; resultados agrupados por programa en una sola columna legible */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#152033; --muted:#5b6678; --line:#dde3ec;
  --accent:#1f4fd1; --accent-soft:#e6edfd; --mark:#ffe58a; --mark-ink:#152033;
  --fi:#1f4fd1; --fce:#0f8a6a; --fedv:#b2560e; --fcsh:#8a3fb8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#161e2d; --ink:#e7ecf4; --muted:#97a3b6; --line:#263247;
  --accent:#7ea2ff; --accent-soft:#1c2a4a; --mark:#5a4a10; --mark-ink:#fff3c4;
  --fi:#7ea2ff; --fce:#45c9a4; --fedv:#f0a05b; --fcsh:#c58cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2d; --ink:#e7ecf4; --muted:#97a3b6; --line:#263247;
  --accent:#7ea2ff; --accent-soft:#1c2a4a; --mark:#5a4a10; --mark-ink:#fff3c4;
  --fi:#7ea2ff; --fce:#45c9a4; --fedv:#f0a05b; --fcsh:#c58cf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.totals{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;gap:16px;font-variant-numeric:tabular-nums}
.totals b{color:var(--ink);font-weight:500}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(10,20,40,.35)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;font:inherit;font-size:1.05rem;padding:13px 92px 13px 44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent);background:var(--surface)}
.search .right{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px}
kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
#clear{font:inherit;font-size:.82rem;border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 10px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:var(--accent-soft);font-weight:600}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
select{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;max-width:100%;min-width:0}
button:focus-visible,select:focus-visible,.chip:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:18px 48px}
.status{color:var(--muted);font-size:.9rem;margin:0 0 14px;font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.ghead{width:100%;font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;border-left:4px solid var(--c)}
.ghead .t{flex:1;min-width:0}
.pname{font-family:var(--display);font-weight:600;font-size:1.06rem;line-height:1.25}
.meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.fac{color:var(--c);font-weight:600}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{transition:transform .15s;color:var(--muted);flex:none}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed ol{display:none}
ol{list-style:none;margin:0;padding:4px 0 8px;border-top:1px solid var(--line);columns:2 280px;column-gap:24px}
li{padding:5px 16px;break-inside:avoid;display:flex;gap:10px;align-items:baseline}
li .n{font-family:var(--mono);font-size:.7rem;color:var(--muted);min-width:1.8em;text-align:right;flex:none;font-variant-numeric:tabular-nums}
li.dim{color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.lvl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px}

.overview h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.overview h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.overview h2 small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:var(--c)}
.pcard .pname{font-size:.98rem}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.hint code{font-family:var(--mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;cursor:pointer;border:0}
@media (max-width:520px){kbd{display:none}#q{padding-right:70px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<header class="top"><div class="wrap">
  <div>

</div></header>

<div class="bar"><div class="wrap">

    <div class="right"><kbd>/</kbd><button id="clear" type="button" hidden>Limpiar</button></div>
  </div>
  <div class="filters" id="filters"></div>
</div></div>

const FAC = {
  FI:{n:"Facultad de Ingenierías",c:"--fi"},
  FCE:{n:"Facultad de Ciencias Empresariales",c:"--fce"},
  FEDV:{n:"Facultad de Educación a Distancia y Virtual",c:"--fedv"},
  FCSH:{n:"Facultad de Ciencias Sociales y Humanas",c:"--fcsh"}
};
const LEVELS = ["Tecnología","Profesional","Especialización","Maestría"];
const levelOf = p => /^Maestr/i.test(p)?"Maestría":/^Especiali/i.test(p)?"Especialización":/^Tecnolog/i.test(p)?"Tecnología":"Profesional";

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
// normaliza carácter a carácter para conservar posiciones al resaltar
const normKeep = s => Array.from(s).map(ch => norm(ch)[0] ?? ch).join("");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PROGS = DATA.map((d,i)=>({
  id:i, f:d.f, p:d.p, lvl:levelOf(d.p),
  ctx: norm(`${d.p} ${d.f} ${FAC[d.f]?.n||""} ${levelOf(d.p)}`),
  subj: d.a.map((a,j)=>({a, n:j+1, k:norm(a), hk:normKeep(a)}))
}));
const total = PROGS.reduce((s,p)=>s+p.subj.length,0);
const unique = new Set(PROGS.flatMap(p=>p.subj.map(s=>s.k))).size;
document.getElementById("totals").innerHTML =
  `<span><b>${Object.keys(FAC).length}</b> facultades</span><span><b>${PROGS.length}</b> programas</span><span><b>${unique}</b> asignaturas distintas</span>`;

const state = { q:"", fac:null, lvl:null, prog:"" , open:new Set() };
try{ const s = JSON.parse(localStorage.getItem("uniajc-buscador")||"{}"); if(s.fac) state.fac=s.fac; if(s.lvl) state.lvl=s.lvl; }catch(e){}

const $q = document.getElementById("q"), $out = document.getElementById("out"),
      $filters = document.getElementById("filters"), $clear = document.getElementById("clear");

function renderFilters(){
  const facChips = Object.entries(FAC).map(([k,v]) =>
    `<button class="chip" type="button" style="--c:var(${v.c})" data-fac="${k}" aria-pressed="${state.fac===k}" title="${v.n}"><span class="dot"></span>${k}</button>`).join("");
  const lvlChips = LEVELS.map(l => `<button class="chip" type="button" data-lvl="${l}" aria-pressed="${state.lvl===l}">${l}</button>`).join("");
  const opts = PROGS.filter(p=>(!state.fac||p.f===state.fac)&&(!state.lvl||p.lvl===state.lvl))
    .sort((a,b)=>a.p.localeCompare(b.p,"es"))
    .map(p=>`<option value="${p.id}" ${String(p.id)===state.prog?"selected":""}>${esc(p.p)}</option>`).join("");
  $filters.innerHTML = `<span class="flabel">Facultad</span>${facChips}<span class="sep"></span>
    <span class="flabel">Nivel</span>${lvlChips}<span class="sep"></span>
    <select id="prog" aria-label="Programa"><option value="">Todos los programas</option>${opts}</select>`;
}

function highlight(item, terms){
  if(!terms.length) return esc(item.a);
  const marks = new Array(item.a.length).fill(false);
  const chars = Array.from(item.a); const hk = item.hk;
  for(const t of terms){ let i = hk.indexOf(t); while(i>-1){ for(let k=i;k<i+t.length;k++) marks[k]=true; i = hk.indexOf(t,i+1);} }
  let out="", open=false;
  chars.forEach((ch,i)=>{ if(marks[i]&&!open){out+="<mark>";open=true} if(!marks[i]&&open){out+="</mark>";open=false} out+=esc(ch); });
  return out+(open?"</mark>":"");
}

function filteredProgs(){
  return PROGS.filter(p => (!state.fac||p.f===state.fac) && (!state.lvl||p.lvl===state.lvl) && (!state.prog||String(p.id)===state.prog));
}

function render(){
  const terms = norm(state.q).trim().split(/\s+/).filter(Boolean);
  $clear.hidden = !state.q;
  const progs = filteredProgs();
  const anyFilter = state.fac||state.lvl||state.prog;

  if(!terms.length && !state.prog){
    // Vista general: programas por facultad
    const byFac = {};
    progs.forEach(p => (byFac[p.f] ||= []).push(p));
    const n = progs.reduce((s,p)=>s+p.subj.length,0);
    $out.innerHTML = `<p class="status">${anyFilter?`<b>${progs.length}</b> programas con <b>${n}</b> asignaturas en el filtro actual.`:"Elige un programa para ver su plan, o escribe arriba para buscar."}</p>
      <div class="overview">` + Object.keys(FAC).filter(f=>byFac[f]).map(f => `
        <h2 style="--c:var(${FAC[f].c})"><span class="dot"></span>${FAC[f].n} <small>${f} · ${byFac[f].length} programas</small></h2>
        <div class="cards">${byFac[f].map(p=>`
          <button class="pcard" type="button" style="--c:var(${FAC[f].c})" data-open="${p.id}">
            <span class="pname">${esc(p.p)}</span>
            <span class="meta"><span class="lvl">${p.lvl}</span><span>${p.subj.length} asignaturas</span></span>
          </button>`).join("")}</div>`).join("") + `</div>`;
    return;
  }

  const groups = [];
  let hits = 0;
  for(const p of progs){
    const ctxHit = terms.filter(t => p.ctx.includes(t));
    const rest = terms.filter(t => !p.ctx.includes(t));
    let list;
    if(!terms.length) list = p.subj;
    else if(!rest.length) list = p.subj;                         // el programa/facultad coincide con todo
    else list = p.subj.filter(s => rest.every(t => s.k.includes(t)));
    if(!list.length) continue;
    hits += list.length;
    groups.push({p, list, hl: rest.length ? rest : terms, whole: list.length===p.subj.length, ctxHit:ctxHit.length>0});
  }
  // los programas cuyo nombre coincide van primero; luego por cantidad de coincidencias
  groups.sort((a,b)=> (b.ctxHit-a.ctxHit) || (b.list.length-a.list.length) || a.p.p.localeCompare(b.p.p,"es"));

  if(!groups.length){
    $out.innerHTML = `<div class="empty"><p>No hay resultados para <b>“${esc(state.q)}”</b>${anyFilter?" con los filtros actuales":""}.</p>
      <p class="hint">${anyFilter?'<button class="chip" type="button" id="reset">Quitar filtros</button> · ':""}Prueba con menos palabras o parte de la palabra, por ejemplo <code data-try="calc">calc</code> o <code data-try="etica">etica</code>.</p></div>`;
    return;
  }

  const distinct = new Set(groups.flatMap(g=>g.list.map(s=>s.k))).size;
  const many = groups.length > 6 && terms.length;
  $out.innerHTML = `<p class="status"><b>${hits}</b> resultado${hits!==1?"s":""} en <b>${groups.length}</b> programa${groups.length!==1?"s":""}${terms.length&&distinct!==hits?` · ${distinct} nombre${distinct!==1?"s":""} de asignatura distinto${distinct!==1?"s":""}`:""}</p>` +
    groups.map(g => {
      const f = FAC[g.p.f]; const key = String(g.p.id);
      const closed = many && g.whole && !state.open.has(key) ? " closed" : "";
      return `<section class="group${closed}" style="--c:var(${f.c})">
        <button class="ghead" type="button" data-toggle="${key}" aria-expanded="${!closed}">
          <span class="t"><span class="pname">${esc(g.p.p)}</span>
            <span class="meta"><span class="fac">${g.p.f}</span><span>${f.n}</span><span class="lvl">${g.p.lvl}</span></span></span>
          <span class="count">${g.whole?g.p.subj.length:`${g.list.length} / ${g.p.subj.length}`}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <ol>${g.list.map(s=>`<li><span class="n">${s.n}</span><span>${highlight(s,g.hl)}</span></li>`).join("")}</ol>
      </section>`;
    }).join("");
}

let t;
$q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(()=>{ state.q = $q.value; state.open.clear(); render(); }, 90); });
$clear.addEventListener("click", () => { $q.value=""; state.q=""; render(); $q.focus(); });
function save(){ try{ localStorage.setItem("uniajc-buscador", JSON.stringify({fac:state.fac,lvl:state.lvl})); }catch(e){} }

$filters.addEventListener("click", e => {
  const b = e.target.closest("[data-fac],[data-lvl]"); if(!b) return;
  if(b.dataset.fac) state.fac = state.fac===b.dataset.fac ? null : b.dataset.fac;
  if(b.dataset.lvl) state.lvl = state.lvl===b.dataset.lvl ? null : b.dataset.lvl;
  const p = PROGS[state.prog]; if(p && ((state.fac&&p.f!==state.fac)||(state.lvl&&p.lvl!==state.lvl))) state.prog="";
  save(); renderFilters(); render();
});
$filters.addEventListener("change", e => { if(e.target.id==="prog"){ state.prog = e.target.value; render(); } });

$out.addEventListener("click", e => {
  const card = e.target.closest("[data-open]");
  if(card){ state.prog = card.dataset.open; renderFilters(); render(); window.scrollTo({top:0}); return; }
  const tg = e.target.closest("[data-toggle]");
  if(tg){ const g = tg.parentElement; const closed = g.classList.toggle("closed"); tg.setAttribute("aria-expanded", !closed);
    closed ? state.open.delete(tg.dataset.toggle) : state.open.add(tg.dataset.toggle); return; }
  const tr = e.target.closest("[data-try]");
  if(tr){ $q.value = tr.dataset.try; state.q = $q.value; render(); return; }
  if(e.target.id==="reset"){ state.fac=state.lvl=null; state.prog=""; save(); renderFilters(); render(); }
});

document.addEventListener("keydown", e => {
  if(e.key==="/" && document.activeElement!==$q && !/input|select|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); $q.focus(); }
  if(e.key==="Escape" && document.activeElement===$q){ $q.value=""; state.q=""; render(); }
});

renderFilters(); render();
</script>
